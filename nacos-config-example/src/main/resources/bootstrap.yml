# ================================================================
#  Bootstrap 上下文配置（优先于 application.yml 加载）
#  对应文章：一、客户端启动 → "引导上下文加载" 章节
#
#  核心机制：
#  - spring-cloud-starter-bootstrap 检测到依赖后，
#    BootstrapApplicationListener 会预先创建 BootstrapContext 父上下文
#  - 优先加载本文件中的 Nacos 连接参数，确保主容器启动前配置中心已就绪
#  - NacosConfigDataLocationResolver 解析本文件中的 spring.config.import，
#    确定需要从 Nacos Server 拉取的 dataId 和 group
#  - NacosConfigDataLoader.load() 通过 ConfigService 拉取远程配置，
#    封装为 NacosPropertySource 注入 Environment，优先级高于本地 application.yml
# ================================================================

spring:
  application:
    name: nacos-config-example
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        # Nacos 服务端地址（对应 NacosConfigProperties.serverAddr）
        server-addr: 127.0.0.1:8848
        # 命名空间（public 命名空间留空，自定义命名空间填命名空间ID）
        namespace: public
        # 认证信息
        username: nacos
        password: nacos
        # 配置文件后缀类型，如 yml / properties / json
        file-extension: yml
        # 动态刷新开关（对应 NacosConfigProperties.refreshEnabled）
        # 开启后 NacosContextRefresher 会为每个配置注册 gRPC 监听器
        refresh-enabled: true

  # Spring Boot 3.x 配置导入机制
  # NacosConfigDataLocationResolver 解析 nacos: 前缀，
  # NacosConfigDataLoader 负责拉取实际配置内容
  config:
    import:
      # optional: 表示即使该配置不存在也不会阻止应用启动
      # nacos:dataId?group=GROUP_NAME 为导入格式
      - optional:nacos:application-${spring.profiles.active}.yml?group=DEFAULT_GROUP
      - optional:nacos:dynamic-config.yml?group=DEFAULT_GROUP

# 日志级别（便于观察配置加载和刷新过程）
logging:
  level:
    com.alibaba.cloud.nacos: DEBUG
    com.alibaba.nacos.client: DEBUG
    com.alibaba.nacos.example: DEBUG
