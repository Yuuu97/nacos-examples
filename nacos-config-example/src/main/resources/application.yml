# ================================================================
#  Application 主上下文配置（本地兜底 + 业务配置）
#  对应文章：一、客户端启动 → "远程配置加载核心" 章节
#
#  注意：本文件中的配置优先级低于 Nacos 远程配置
#  当 Nacos Server 不可用时，本文件作为降级兜底
#  远程配置覆盖规则：NacosServer > bootstrap.yml > application.yml
# ================================================================

server:
  port: 8080

# ================================================================
# App 业务配置（会被 Nacos Server 上的 dynamic-config.yml 覆盖）
# 对应文章：三、客户端接收 → "从推送通知到配置生效" 章节
#
# 演示 @RefreshScope 动态刷新：
# - 首次启动时使用此默认值
# - Nacos 控制台修改 dynamic-config.yml 的 app.* 配置后，
#   gRPC 推送通知 → NacosConfigRefreshEvent → RefreshEvent → @RefreshScope Bean 重建
# - ConfigDemoController 中注入的这些属性会实时更新
# ================================================================
app:
  name: nacos-config-demo
  version: 1.0.0
  # 定时打印配置的间隔（毫秒），对应文章 SocketRefreshRunner 的轮询机制
  refresh-interval: 5000

# ================================================================
# 配置说明：
# 1. 在 Nacos 控制台创建以下配置进行测试：
#    - dataId: application-dev.yml, group: DEFAULT_GROUP
#      → 环境配置（启动时自动加载）
#    - dataId: dynamic-config.yml, group: DEFAULT_GROUP
#      → 业务动态配置（修改后自动热刷新）
#
# 2. 验证步骤：
#    ① 启动应用 → 观察控制台日志，确认配置从 Nacos 拉取成功
#    ② GET /config/info → 查看当前生效的配置（含 @RefreshScope）
#    ③ GET /config/direct?dataId=dynamic-config.yml → 直接通过 ConfigService 读取
#    ④ 在 Nacos 控制台修改 dynamic-config.yml 的 app.version
#    ⑤ 等待几秒后再次 GET /config/info → 确认 version 已自动刷新
# ================================================================
