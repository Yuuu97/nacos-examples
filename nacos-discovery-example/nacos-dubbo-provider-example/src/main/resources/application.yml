# Dubbo Provider 配置 — 注册服务到 Nacos，通过 Dubbo 协议暴露 RPC 端点
# 技术栈：Spring Boot 3.2.5 + Dubbo 3.3.0 + JDK 17

server:
  port: 8083

spring:
  application:
    name: dubbo-provider-example

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
  protocol:
    name: tri
    port: 20880
    host: 127.0.0.1
    serialization: fastjson2
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
  metadata-report:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
    timeout: 5000
    retry-times: 3
  provider:
    version: 1.0.0
    group: DEFAULT_GROUP
    timeout: 5000
    retries: 0
    delay: -1

logging:
  level:
    com.alibaba.nacos.example: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos.client: INFO
