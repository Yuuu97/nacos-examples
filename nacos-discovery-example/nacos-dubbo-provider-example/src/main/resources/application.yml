# Dubbo Provider 配置 — 以 Spring Cloud 为服务治理核心，Dubbo 3.3.0 作为 RPC 通信框架
# 技术栈：Spring Boot 3.2.5 + Spring Cloud 2023.0.4 + Spring Cloud Alibaba 2023.0.3.4 + Dubbo 3.3.0 + JDK 17

server:
  port: 8083

spring:
  application:
    name: dubbo-provider-example
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
        enabled: true

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    # register-mode: all — Dubbo 同时注册到 Spring Cloud 和 Dubbo 注册中心
    # Dubbo 服务实例以 Spring Cloud 服务发现格式写入 Nacos，实现双重注册
    register-mode: all
  protocol:
    name: tri
    port: 20880
    host: 127.0.0.1
    serialization: fastjson2
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
  metadata-report:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
    timeout: 5000
    retry-times: 3
  provider:
    version: 1.0.0
    group: DEFAULT_GROUP
    timeout: 5000
    retries: 0
    delay: -1

logging:
  level:
    com.alibaba.nacos.example: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos.client: INFO
