# Dubbo Consumer 配置 — 以 Spring Cloud 为服务治理核心，Dubbo 3.3.0 作为 RPC 通信框架
# 技术栈：Spring Boot 3.2.5 + Spring Cloud 2023.0.4 + Spring Cloud Alibaba 2023.0.3.4 + Dubbo 3.3.0 + JDK 17

server:
  port: 8084

spring:
  application:
    name: dubbo-consumer-example
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: public
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
        enabled: true

dubbo:
  application:
    name: ${spring.application.name}
    logger: slf4j
    # register-mode: all — Consumer 也注册实例，便于 Spring Cloud 服务列表可见
    # qos-enable: false — 关闭 Dubbo QoS 端口，避免与 Spring Boot 端口冲突
    register-mode: all
    qos-enable: false
  protocol:
    name: tri
    port: -1
    serialization: fastjson2
    host: 127.0.0.1
  registry:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
  metadata-report:
    address: nacos://127.0.0.1:8848
    parameters:
      namespace: public
      group: DEFAULT_GROUP
      username: nacos
      password: nacos
    timeout: 5000
    retry-times: 3
  consumer:
    version: 1.0.0
    group: DEFAULT_GROUP
    timeout: 5000
    retries: 0
    check: false
    loadbalance: roundrobin

logging:
  level:
    com.alibaba.nacos.example: DEBUG
    org.apache.dubbo: INFO
    com.alibaba.nacos.client: INFO
